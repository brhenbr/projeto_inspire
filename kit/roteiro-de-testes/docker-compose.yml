# Roteiro de Testes. Subir:  docker compose up -d --build   (abra http://127.0.0.1:8090)
# Os roteiros vêm da pasta CASOS_DIR_HOST (padrão: ./casos-exemplo, somente leitura).
# A área Resultados abre direto, sem senha: por isso a porta só é publicada em 127.0.0.1.
name: roteiro-de-testes
services:
  roteiro:
    build: .
    ports:
      - "127.0.0.1:${ROTEIRO_PORT:-8090}:8000" # só esta máquina; para outras pessoas, troque 127.0.0.1 de forma consciente
    volumes:
      - roteiro-dados:/data
      - ${CASOS_DIR_HOST:-./casos-exemplo}:/casos:ro
    read_only: true
    tmpfs: [/tmp]
    cap_drop: [ALL]
    security_opt: ["no-new-privileges:true"]
    restart: unless-stopped
volumes:
  roteiro-dados:
