[project]
name = "inspire-catalogo"
version = "0.1.0"
description = "Extração, discovery e curadoria do catálogo do dados.gov.br"
requires-python = ">=3.12"
dependencies = [
    "fastapi",
    "uvicorn[standard]",
    "sqlalchemy>=2",
    "psycopg[binary]>=3",
    "alembic",
    "pydantic-settings",
    "httpx",
    "structlog",
]

[dependency-groups]
dev = [
    "pytest",
    "pytest-cov",
    "ruff",
    "mypy",
    "respx",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/inspire"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["tests"]
addopts = "-ra --strict-markers"
markers = ["integration: precisa do PostgreSQL do docker compose"]

[tool.coverage.run]
source = ["inspire"]
branch = true

[tool.coverage.report]
show_missing = true
fail_under = 80

[tool.ruff]
line-length = 100
target-version = "py312"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "S", "SIM", "RUF"]
# E501: comprimento de linha em comentários e textos em português fica a critério; o formatador cuida do código.
ignore = ["E501"]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S101", "S608"]
# Busca/painel montam SQL só com nomes de coluna de listas fixas; todo valor vai por parâmetro.
"src/inspire/discovery/*.py" = ["S608"]
"src/inspire/api/routes/llm.py" = ["S608"]

[tool.mypy]
strict = true
python_version = "3.12"
files = ["src"]
plugins = []
