server {
  listen 8080;
  server_name _;
  root /usr/share/nginx/html;
  index index.html;

  # API publicada em /api (o prefixo é removido antes de chegar ao FastAPI).
  # O nome "api" é resolvido a cada 10 s pelo DNS do Docker; sem isso o nginx guarda o IP do início e
  # devolve 502 quando a API é recriada.
  location /api/ {
    resolver 127.0.0.11 valid=10s ipv6=off;
    set $upstream http://api:8000;
    rewrite ^/api/(.*)$ /$1 break;
    proxy_pass $upstream;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-For $remote_addr;
    proxy_read_timeout 60s;
  }

  location / {
    try_files $uri /index.html;
  }

  add_header X-Content-Type-Options nosniff always;
  add_header X-Frame-Options DENY always;
  add_header Referrer-Policy no-referrer always;
}
